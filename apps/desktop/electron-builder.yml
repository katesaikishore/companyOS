appId: com.companyos.twin
productName: companyOS Twin
copyright: Copyright © companyOS
directories:
  output: release
  buildResources: build
# Every installer and update file is named companyOS-Twin-<version>-<arch>.<ext>, with no spaces. The default names start
# with the product name ("companyOS Twin"), and the update files (latest*.yml) list a file by the name it was built with.
# GitHub does not keep spaces in release asset names, so a spaced name would not match its upload, and an update feed
# served from a GitHub Release would 404. The default Linux names also start with the package name, "@companyos/desktop",
# which puts the .deb and .rpm in a folder that does not exist and fails the build.
artifactName: companyOS-Twin-${version}-${arch}.${ext}
files:
  - dist/**/*
  - package.json
  # The packaged app ships the two-ring icons. The window and tray read their PNGs from the renderer's brand folder.
  - build/icons/*.png
# The browser bridge's native host runs outside the asar archive, and the unpacked extension is kept for loading.
extraResources:
  - from: ../browser-ext/native-host
    to: browser-ext/native-host
  - from: ../browser-ext/dist
    to: browser-ext/extension
    # The Firefox build stays out of the app until Firefox visits are accepted and its add-on ID is set.
    filter:
      - "**/*"
      - "!firefox/**"
asar: true
# The encrypted store's native module (better-sqlite3-multiple-ciphers) ships Node-API prebuilds for every platform,
# so it runs unchanged in Electron. A rebuild would compile the bundled SQLite from source for no benefit.
# The same holds for onnxruntime-node 1.31.1: it ships Node-API (napi-v6) bindings for darwin/arm64, linux/x64,
# linux/arm64, win32/x64 and win32/arm64, so no Electron rebuild is needed. It ships none for Intel Macs, and the app
# does not offer the decision model there (src/main/laya.ts).
npmRebuild: false
# Code signing is off unless a certificate is configured in the environment. No secret or password lives in this file.
# Set these in CI (or locally) to sign and notarise:
#   macOS, signing:       CSC_LINK (a .p12 file or its base64 text), CSC_KEY_PASSWORD
#   macOS, notarisation:  APPLE_API_KEY (path to the .p8 key), APPLE_API_KEY_ID, APPLE_API_ISSUER,
#                         or APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, APPLE_TEAM_ID. Notarisation runs only when one set is complete.
#   Windows, signing:     WIN_CSC_LINK, WIN_CSC_KEY_PASSWORD (Azure Artifact Signing is not configured yet)
# Local builds (npm run dist, npm run dist:dir) go through scripts/package.mjs, which keeps auto-discovery off, so a
# keychain identity is used only when CSC_LINK, CSC_NAME or WIN_CSC_LINK is set.
# A release build (COMPANYOS_RELEASE=1, set by the release workflow) also needs the macOS certificate and the App
# Store Connect key, and it fails without them. See scripts/package.mjs.
# Icons: build/icon.icns, build/icon.ico and build/icons/*.png come from scripts/make-icons.mjs.
# Auto-update: the placeholder feed below does not resolve, and the app does not use it. A packaged build checks the
# feed in COMPANYOS_UPDATE_URL when that variable is set (src/main/updater.ts). It checks nothing otherwise. A GitHub
# Release can serve as the feed. See "Update feed" in docs-site/releasing.mdx.
publish:
  provider: generic
  url: https://updates.companyos.invalid/twin
asarUnpack:
  # node-llama-cpp loads its native addon and llama.cpp libraries from disk, which asar cannot serve.
  # On Electron it maps the .asar path to .asar.unpacked itself, so these files must be unpacked.
  - "**/node_modules/@node-llama-cpp/**"
  # onnxruntime-node (the Laya decision model's runtime) loads onnxruntime_binding.node, and that file links the runtime
  # library that sits beside it (libonnxruntime.so.1, libonnxruntime.1.dylib, onnxruntime.dll). Both must be real files on
  # disk, so the whole bin folder is unpacked. electron-builder unpacks a whole package that contains a .node file, so the
  # package's JavaScript is unpacked with it (checked in an unpacked build).
  - "**/node_modules/onnxruntime-node/bin/**"
  # tesseract.js starts its recognition worker from a file, and it reads the English data from disk. The worker cannot be
  # started from inside the archive, so the engine, its wasm core and the data package are unpacked (src/main/ocr-worker.ts).
  - "**/node_modules/tesseract.js/**"
  - "**/node_modules/tesseract.js-core/**"
  - "**/node_modules/@tesseract.js-data/**"
  # transformers.js loads sharp for image inputs, and sharp loads a native library from disk, which asar cannot serve.
  - "**/node_modules/@img/**"
mac:
  # onnxruntime-node and sharp hold the bindings of every platform in their packages. Each build keeps only its own.
  files:
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/{linux,win32}/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/darwin/!(${arch})/**"
    - "!**/node_modules/@img/sharp-{linux,linuxmusl,win32}-*/**"
    - "!**/node_modules/@img/sharp-libvips-{linux,linuxmusl,win32}*/**"
    - "!**/node_modules/@img/sharp-darwin-!(${arch})/**"
    - "!**/node_modules/@img/sharp-libvips-darwin-!(${arch})/**"
  category: public.app-category.productivity
  icon: build/icon.icns
  target:
    - dmg
    - zip
  # distribution stops electron-builder from signing with a Mac Developer identity when no Developer ID is found.
  type: distribution
  hardenedRuntime: true
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.plist
  extendInfo:
    # macOS shows this text when the twin first asks to see the frontmost app through System Events.
    NSAppleEventsUsageDescription: companyOS Twin asks macOS which app is in front, so it can understand your routines on this device.
    # macOS needs this text before the app can use the microphone. The app listens only while microphone capture is on.
    NSMicrophoneUsageDescription: companyOS Twin listens to the microphone only when you turn on microphone capture, and keeps the words it hears as searchable text on this device.
    # Screen recording has no prompt of its own on every macOS version. The text states the purpose in the app's Info.plist.
    NSScreenCaptureUsageDescription: companyOS Twin reads the screen only when you turn on screen capture, and keeps the text it reads and sealed images on this device.
dmg:
  # Signed when a Developer ID identity is configured. electron-builder does not notarise the image, so
  # scripts/package.mjs does that in a release build.
  sign: true
win:
  files:
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/{darwin,linux}/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/win32/!(${arch})/**"
    - "!**/node_modules/@img/sharp-{darwin,linux,linuxmusl}-*/**"
    - "!**/node_modules/@img/sharp-libvips-{darwin,linux,linuxmusl}*/**"
    - "!**/node_modules/@img/sharp-win32-!(${arch})/**"
  icon: build/icon.ico
  target:
    - nsis
  signAndEditExecutable: true
linux:
  files:
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/{darwin,win32}/**"
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/linux/!(${arch})/**"
    - "!**/node_modules/@img/sharp-{darwin,win32}-*/**"
    - "!**/node_modules/@img/sharp-libvips-{darwin,win32}*/**"
    - "!**/node_modules/@img/sharp-linux-!(${arch})/**"
    - "!**/node_modules/@img/sharp-libvips-linux-!(${arch})/**"
    # npm install fetches these two GPU providers (about 285 MB) for linux/x64. The decision model runs on the CPU, so they stay out.
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/linux/*/libonnxruntime_providers_cuda.so"
    - "!**/node_modules/onnxruntime-node/bin/napi-v6/linux/*/libonnxruntime_providers_tensorrt.so"
    # npm install also fetches llama.cpp builds for the other chips and for the CUDA and Vulkan GPUs, about 0.6 GB in all.
    # Keep only this app's own build: the x64 CPU build for x64, the Arm build for arm64.
    - "!**/node_modules/@node-llama-cpp/linux-!(${arch})/**"
  icon: build/icons
  category: Utility
  maintainer: companyOS <packages@companyos.invalid>
  description: Private, employee-owned work twin.
  target:
    - deb
    - rpm
