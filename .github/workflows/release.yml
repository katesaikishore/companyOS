name: release

# Runs when a version tag such as v0.2.0 is pushed, in two jobs:
#   package:       builds the installers on macOS, Windows and Linux with the desktop packaging script
#                  (apps/desktop/scripts/package.mjs, through npm run dist). macOS must be Developer ID signed and
#                  notarised, so its job fails without the secrets. Windows and Linux build unsigned when their
#                  certificate secret is missing.
#   draft-release: gathers those installers and the update files that electron-updater reads (latest*.yml and
#                  *.blockmap) into one DRAFT GitHub Release for the tag.
# Nothing here publishes a release. The draft stays private until a person reviews it on GitHub and publishes it by
# hand. Secrets are referenced by name only and never stored in the repository (see electron-builder.yml).

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  package:
    name: package (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # electron-builder must not pick up a certificate that happens to be on the runner.
      CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      # The app runs on the CPU. Skipping the CUDA provider keeps the install small and leaves room on the runner.
      ONNXRUNTIME_NODE_INSTALL_CUDA: 'skip'
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Check the tag matches the desktop version
        shell: bash
        run: |
          version="$(node -p "require('./apps/desktop/package.json').version")"
          if [ "$GITHUB_REF_NAME" != "v$version" ]; then
            echo "The tag $GITHUB_REF_NAME does not match apps/desktop/package.json version $version."
            exit 1
          fi

      - name: Install (also downloads the Electron binary)
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests (core engine and desktop)
        run: npm test

      - name: Build
        run: npm run build

      - name: Install rpm tooling (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y rpm

      - name: Load the macOS notarisation key (only when its secrets exist)
        if: runner.os == 'macOS'
        shell: bash
        env:
          APPLE_API_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
        run: |
          if [ -z "$APPLE_API_KEY_P8" ] || [ -z "$APPLE_API_KEY_ID" ] || [ -z "$APPLE_API_ISSUER" ]; then
            echo "Notarisation: skipped, the App Store Connect secrets are not set."
            exit 0
          fi
          key="$RUNNER_TEMP/AuthKey_$APPLE_API_KEY_ID.p8"
          printf '%s' "$APPLE_API_KEY_P8" > "$key"
          {
            echo "APPLE_API_KEY=$key"
            echo "APPLE_API_KEY_ID=$APPLE_API_KEY_ID"
            echo "APPLE_API_ISSUER=$APPLE_API_ISSUER"
          } >> "$GITHUB_ENV"
          echo "Notarisation: enabled."

      - name: Package macOS (release build, signed, notarised and checked)
        if: runner.os == 'macOS'
        shell: bash
        env:
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # The build stops without the certificate and the App Store Connect key, rather than shipping a copy that
          # Gatekeeper would flag. scripts/package.mjs runs the checks.
          COMPANYOS_RELEASE: '1'
        run: npm run dist -w @companyos/desktop

      - name: Package Windows (signed only when WIN_CSC_LINK is set)
        if: runner.os == 'Windows'
        shell: bash
        env:
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
        run: |
          if [ -n "$WIN_CSC_LINK" ]; then echo "Signing: a certificate is set."; else echo "Signing: no certificate, building unsigned."; fi
          npm run dist -w @companyos/desktop

      - name: Package Linux (unsigned)
        if: runner.os == 'Linux'
        run: npm run dist -w @companyos/desktop

      # Per platform, electron-updater reads latest-mac.yml with the zip (and its blockmap), latest.yml with the NSIS
      # installer (and its blockmap), or latest-linux.yml with the deb and rpm. The dmg is for a manual install only.
      - name: Upload installers and update files
        uses: actions/upload-artifact@v4
        with:
          name: installers-${{ runner.os }}
          path: |
            apps/desktop/release/*.dmg
            apps/desktop/release/*.zip
            apps/desktop/release/*.exe
            apps/desktop/release/*.deb
            apps/desktop/release/*.rpm
            apps/desktop/release/*.blockmap
            apps/desktop/release/latest*.yml
          if-no-files-found: error

  draft-release:
    name: draft GitHub Release
    needs: package
    runs-on: ubuntu-latest
    # Only this job can write to the repository, and it only creates a draft. No step here publishes or un-drafts.
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download the installers and update files from every platform
        uses: actions/download-artifact@v4
        with:
          pattern: installers-*
          path: release-files
          merge-multiple: true

      - name: Check the update files for each platform are present
        shell: bash
        run: |
          for file in latest-mac.yml latest.yml latest-linux.yml; do
            if [ ! -f "release-files/$file" ]; then
              echo "Missing $file. The update feed needs it, so no draft is created."
              exit 1
            fi
          done
          ls -l release-files

      - name: Create the draft release
        shell: bash
        run: |
          # Stop rather than change a release that already exists. gh release view only finds published releases, so
          # this reads the full list, which also includes drafts.
          releases="$(gh api --paginate "repos/$GH_REPO/releases" --jq '.[].tag_name')"
          if grep -Fxq -- "$TAG" <<< "$releases"; then
            echo "A release for $TAG already exists, as a draft or published. Nothing was changed. Delete it on GitHub to run this again."
            exit 1
          fi
          gh release create "$TAG" release-files/* \
            --draft \
            --verify-tag \
            --title "companyOS Twin $TAG" \
            --generate-notes
          echo "Draft release $TAG created. Review it on GitHub and publish it by hand."
